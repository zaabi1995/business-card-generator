<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" fill="none">
  <defs>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect width="68" height="44" rx="10" fill="url(#cardGradient)"/>
  <!-- White Inner Card -->
  <rect x="8" y="8" width="52" height="28" rx="6" fill="#ffffff"/>
  <!-- Avatar Circle (orange) -->
  <rect x="14" y="14" width="10" height="10" rx="5" fill="#f59e0b"/>
  <!-- Info Lines -->
  <rect x="28" y="14" width="24" height="4" rx="2" fill="#2563eb"/>
  <rect x="28" y="22" width="18" height="4" rx="2" fill="#93c5fd"/>
  <!-- Cardify Text -->
  <text x="78" y="30" font-family="Gill Sans, Gill Sans MT, Calibri, sans-serif" font-size="26" font-weight="600" fill="#1e3a5f">Cardify</text>
</svg>
