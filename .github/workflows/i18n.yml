name: i18n parity check

on:
  pull_request:
    paths:
      - 'lang/**'
      - 'scripts/i18n-audit.php'
      - '.github/workflows/i18n.yml'
  push:
    branches: [main]
    paths:
      - 'lang/**'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up PHP
        uses: shivammathur/setup-php@383a511d0ed762f8bdb060ec71ff6cbefc41f73a # v2.37.0
        with:
          php-version: '8.2'
          coverage: none
      - name: Run i18n audit + parity check
        run: php scripts/i18n-audit.php
