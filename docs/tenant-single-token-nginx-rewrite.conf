# Tenant single-token URL rewrite for Cardify nginx
#
# Apply to: /www/server/panel/vhost/rewrite/cardify.om.conf
# After applying:   nginx -t && systemctl reload nginx
#
# WHY:
#   The wizard's step-3 "Shareable card URL" promises
#   <slug>.cardify.om/<email-localpart>, e.g. https://hosn.cardify.om/ali.
#   nginx already had rewrites for /portal, /admin/X, /card/X, /firstname.lastname
#   (with a dot) and /X.vcf — but NO rule for a single-token path like /ali.
#   Without this rule nginx returns 404 from the filesystem before PHP runs,
#   and the wizard's preview link is broken.
#
# WHERE:
#   Inside the existing `if ($tenant) { ... }` block in
#   /www/server/panel/vhost/rewrite/cardify.om.conf, AFTER the firstname.lastname
#   and *.vcf rewrites and BEFORE the closing brace.
#
# HOW IT WORKS:
#   Routes /ali, /mohammed, /first-last, /ali_zaabi (no slashes, no extension)
#   to /index.php. The PHP tenant block in index.php then resolves the segment
#   as an email-localpart against the tenant's employees table (via
#   SUBSTRING_INDEX(email, '@', 1) match) and serves digital_card.php with the
#   matched employee, OR falls through to portal.php if no match.
#
#   Reserved single-token paths (/portal, /login, /admin) are caught by
#   earlier rewrites in the same `if ($tenant)` block and never reach this
#   one. Files like /favicon.svg and /robots.txt are served from disk first
#   because nginx tries the filesystem before applying rewrites.

# Single-token URL like /ali → index.php (which resolves it as an
# email-localpart against the tenant employees, or falls through
# to login/portal). Reserved single-token paths like /portal and
# /login are matched by earlier rewrites and never reach this one.
rewrite ^/([a-z0-9][a-z0-9_.-]*)/?$  /index.php last;
