# Cardify Arabic URL tree, nginx rewrites
#
# Apply to: /www/server/panel/vhost/rewrite/cardify.om.conf
# Then:     nginx -t && systemctl reload nginx
# Verify:   php tools/verify-ar-twins.php /www/server/panel/vhost/rewrite/cardify.om.conf
# Keep UTF-8 explicit so Arabic links in llms.txt are decoded correctly.
charset utf-8;
#
# This file must stay 1:1 with ArTwins::PATHS in includes/ArTwins.php. The
# verifier compares the two SETS and fails in either direction, because the
# tree broke exactly here: /ar/pricing was rewritten and live while /ar/about
# had no rule and 404'd, and nothing in the codebase noticed the difference.
#
# A path earns an /ar/ URL only when the page BODY is translated. The shared
# header/footer alone renders ~663 Arabic characters on any page, so a page
# that measures at that floor with ?lang=ar has no Arabic content of its own
# and gets NO /ar/ URL: /security, /cookies, /industries and every
# /solutions/{slug}, /tools/{slug} and /gcc/{country} child are in that group.

# --- Already present in the conf (listed here for the full picture) ---
# rewrite ^/ar/?$                    /index.php?lang=ar last;
# (retired) ^/ar/get-started -> now 301 to /get-started, body was English
# rewrite ^/ar/pricing/?$            /pricing.php?lang=ar last;
# rewrite ^/ar/faq/?$                /faq.php?lang=ar last;
# rewrite ^/ar/contact/?$            /contact.php?lang=ar last;
# rewrite ^/ar/terms/?$              /terms.php?lang=ar last;
# rewrite ^/ar/privacy/?$            /privacy.php?lang=ar last;
# (retired) ^/ar/blog -> now 301 to /blog, post titles and bodies are English
# rewrite ^/ar/print-shops/?$        /print-shops.php?lang=ar last;
# rewrite ^/ar/status/?$             /status.php?lang=ar last;
# rewrite ^/ar/changelog/?$          /changelog.php?lang=ar last;
# rewrite ^/ar/case-studies/?$       /case-studies.php?lang=ar last;
# rewrite ^/ar/companies/?$          /companies.php?lang=ar last;
# rewrite ^/ar/logos/?$              /logos.php?view=hub&lang=ar last;
# rewrite ^/ar/oman-business-index/?$ /oman-business-index.php?lang=ar last;

# --- Added Jul 2026, closing the partial tree ---
rewrite ^/ar/about/?$              /about.php?lang=ar last;
rewrite ^/ar/app/?$                /app.php?lang=ar last;
rewrite ^/ar/careers/?$            /careers.php?lang=ar last;
rewrite ^/ar/gcc-business-index/?$ /gcc-business-index.php?lang=ar last;
rewrite ^/ar/nfc-business-card/?$  /nfc-business-card.php?lang=ar last;
rewrite ^/ar/press-kit/?$          /press.php?lang=ar last;
rewrite ^/ar/solutions/?$          /solutions.php?lang=ar last;
rewrite ^/ar/tools/?$              /tools.php?lang=ar last;

# --- Retired: /ar/ URLs that served an ENGLISH body ---
# Measured by Arabic share of the page's letters, not a raw Arabic count:
# a count above the chrome floor passed both of these, the share did not.
#   /ar/blog        0.13 (1,107 Arabic chrome over 7,302 Latin post titles)
#   /ar/get-started 0.24 (entirely English landing body)
# Both were a second URL serving English copy, so they 301 to the canonical
# rather than 404, which preserves any inbound link. The AR nav sending a
# reader to the English blog is the truth: there is no Arabic blog.
rewrite ^/ar/blog/?$                     /blog permanent;
rewrite ^/ar/blog/([a-z0-9-]+)/?$        /blog/$1 permanent;
rewrite ^/ar/get-started/?$              /get-started permanent;
