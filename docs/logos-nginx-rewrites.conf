# Omani Logo Library — nginx rewrite rules
#
# Apply to: /www/server/panel/vhost/rewrite/cardify.om.conf
# After applying:   nginx -t && systemctl reload nginx
#
# See docs/superpowers/plans/2026-04-18-cardify-omani-logo-library.md Task 28.

# --- Pretty URLs ---
location = /logos                         { rewrite ^ /logos.php?view=hub    last; }
location = /logos/                        { rewrite ^ /logos.php?view=hub    last; }
location = /logos/press                   { rewrite ^ /logos.php?view=press  last; }
location = /logos/terms                   { rewrite ^ /logos.php?view=terms  last; }
location ~ ^/logos/([a-z0-9-]+)$          { rewrite ^ /logos.php?view=sector&sector=$1 last; }
# Arabic variants
location = /ar/logos                      { rewrite ^ /logos.php?view=hub&lang=ar last; }
location = /ar/logos/                     { rewrite ^ /logos.php?view=hub&lang=ar last; }
location = /ar/logos/press                { rewrite ^ /logos.php?view=press&lang=ar last; }
location = /ar/logos/terms                { rewrite ^ /logos.php?view=terms&lang=ar last; }
location ~ ^/ar/logos/([a-z0-9-]+)$       { rewrite ^ /logos.php?view=sector&sector=$1&lang=ar last; }

# --- Flow endpoints ---
location = /logo-claim                    { rewrite ^ /logo-claim.php    last; }
location = /logo-takedown                 { rewrite ^ /logo-takedown.php last; }
location = /logo-download                 { rewrite ^ /logo-download.php last; }

# --- Public API ---
location = /api/logos/list                { rewrite ^ /api/logos/list.php    last; }
location = /api/logos/show                { rewrite ^ /api/logos/show.php    last; }  # ?slug=… query form
location ~ ^/api/logos/show/([a-z0-9-]+)$ { rewrite ^ /api/logos/show.php?slug=$1 last; }  # /show/{slug} path form
location = /api/logos/sectors             { rewrite ^ /api/logos/sectors.php last; }
location = /api/logos/stats               { rewrite ^ /api/logos/stats.php   last; }

# --- Sitemap child ---
location = /sitemap-logos.xml             { rewrite ^ /sitemap.php?part=logos last; }

# --- Storage: logos + OG images served directly, long cache ---
location ~ ^/storage/(logos|og/logos)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

# --- Pending uploads: admin-only (PHP-gated; double-protect) ---
location ^~ /storage/logos/pending/ {
    deny all;
    return 403;
}
