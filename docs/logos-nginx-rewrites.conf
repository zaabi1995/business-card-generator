# Omani Logo Library — nginx rewrite rules
#
# Apply to: /www/server/panel/vhost/rewrite/cardify.om.conf
# After applying:   nginx -t && systemctl reload nginx
#
# IMPORTANT: Uses server-level `rewrite` statements (not `location` blocks) to
# match the convention of every other Cardify URL in this file. Location
# blocks can conflict with the existing `if (!-f)` catch-all that runs at
# server scope; server-level rewrites route cleanly and the trailing `last`
# restarts nginx matching so the .php file handler takes over.
#
# See docs/superpowers/plans/2026-04-18-cardify-omani-logo-library.md Task 28.

# --- Pretty URLs ---
rewrite ^/logos/?$                      /logos.php?view=hub     last;
rewrite ^/logos/press/?$                /logos.php?view=press   last;
rewrite ^/logos/terms/?$                /logos.php?view=terms   last;
rewrite ^/logos/([a-z0-9-]+)/?$         /logos.php?view=sector&sector=$1 last;
# Arabic variants
rewrite ^/ar/logos/?$                   /logos.php?view=hub&lang=ar   last;
rewrite ^/ar/logos/press/?$             /logos.php?view=press&lang=ar last;
rewrite ^/ar/logos/terms/?$             /logos.php?view=terms&lang=ar last;
rewrite ^/ar/logos/([a-z0-9-]+)/?$      /logos.php?view=sector&sector=$1&lang=ar last;

# --- Flow endpoints ---
rewrite ^/logo-claim/?$                 /logo-claim.php    last;
rewrite ^/logo-takedown/?$              /logo-takedown.php last;
rewrite ^/logo-download/?$              /logo-download.php last;

# --- Public API ---
rewrite ^/api/logos/list/?$             /api/logos/list.php    last;
rewrite ^/api/logos/show/?$             /api/logos/show.php    last;  # ?slug=… query form
rewrite ^/api/logos/show/([a-z0-9-]+)/?$  /api/logos/show.php?slug=$1 last;  # /show/{slug} path form
rewrite ^/api/logos/sectors/?$          /api/logos/sectors.php last;
rewrite ^/api/logos/stats/?$            /api/logos/stats.php   last;

# --- Sitemap child ---
rewrite ^/sitemap-logos\.xml$           /sitemap.php?part=logos last;

# --- Storage: logos + OG images served directly, long cache (location block
#     is fine here since /storage/ has no competing rewrites). ---
location ~ ^/storage/(logos|og/logos)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

# --- Pending uploads: admin-only (PHP-gated; double-protect) ---
location ^~ /storage/logos/pending/ {
    deny all;
    return 403;
}
