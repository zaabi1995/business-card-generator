# r328: head-term, comparison and glossary routing for cardify.om.
#
# THESE ARE THE REAL ROUTES. cardify.om is served by nginx and there is no
# Apache in front of it, so .htaccess in the repo root is INERT: it documents
# intent and nothing more. Routing lives in the aaPanel file
#
#     /www/server/panel/vhost/rewrite/cardify.om.conf
#
# which is not under version control, which is why this file exists. Anything
# added here must be added there, and anything added there should be recorded
# here, or the next rebuild of that box loses the routes silently.
#
# PLACEMENT MATTERS. These rules must sit with the other content rewrites near
# the top of that file, ABOVE the catch-all
#
#     if (!-f $request_filename) {
#         rewrite ^/([a-z0-9][a-z0-9-]*)/?$ /router.php?company_slug=$1 last;
#     }
#
# because that catch-all swallows every single-segment path and hands it to
# the tenant router. A rule placed below it never runs, and the page 404s
# while looking correctly deployed on disk.
#
# Singular is canonical, plural 301s to it. Popl uses the singular for the
# same head term, and shipping both as 200s would be a self-inflicted
# duplicate for the sake of one extra URL.

# --- Head-term landing pages ---
rewrite ^/digital-business-cards/?$   /digital-business-card   permanent;
rewrite ^/digital-business-card/?$    /digital-business-card.php   last;
rewrite ^/nfc-business-cards/?$       /nfc-business-card       permanent;
rewrite ^/nfc-business-card/?$        /nfc-business-card.php       last;
rewrite ^/virtual-business-cards/?$   /virtual-business-card   permanent;
rewrite ^/virtual-business-card/?$    /virtual-business-card.php   last;

# --- Comparison cluster ---
# /vs and /alternatives are aliases, not pages. One hub, two 301s into it.
rewrite ^/(vs|alternatives)/?$        /compare                 permanent;
rewrite ^/compare/index/?$            /compare                 permanent;
rewrite ^/(vs|compare)/popl/?$        /compare/cardify-vs-popl permanent;
rewrite ^/(vs|compare)/blinq/?$       /compare/cardify-vs-blinq permanent;
rewrite ^/(vs|compare)/hihello/?$     /compare/cardify-vs-hihello permanent;
rewrite ^/compare/?$                  /compare/index.php       last;
# The slug class excludes underscore on purpose: compare/_verify-note.php is
# a shared partial and must not be reachable as a page.
rewrite ^/compare/([a-z0-9-]+)/?$     /compare/$1.php          last;

# --- Glossary ---
rewrite ^/glossary/index/?$           /glossary                permanent;
rewrite ^/glossary/?$                 /glossary/index.php      last;
rewrite ^/glossary/([a-z0-9-]+)/?$    /glossary/term.php?term=$1 last;

# --- .php twins 301 to the clean URL. Append inside the existing r6-89
#     `if ($request_method = GET) { ... }` block, not here. Server-level
#     rewrites are not re-run after a `last`, so these cannot loop with the
#     clean-URL rules above. ---
#
#   rewrite ^/digital-business-card\.php$   /digital-business-card   permanent;
#   rewrite ^/nfc-business-card\.php$       /nfc-business-card       permanent;
#   rewrite ^/virtual-business-card\.php$   /virtual-business-card   permanent;
#   rewrite ^/compare/index\.php$           /compare                 permanent;
#   rewrite ^/glossary/index\.php$          /glossary                permanent;
