# Print partner public signup routes for cardify.om
#
# Production is nginx. .htaccess in this repo is inert on the VPS.
# Apply these ABOVE the catch-all
#
#     if (!-f $request_filename) {
#         rewrite ^/([a-z0-9][a-z0-9-]*)/?$ /router.php?company_slug=$1 last;
#     }
#
# in /www/server/panel/vhost/rewrite/cardify.om.conf
# Then: nginx -t && systemctl reload nginx
#
# /partners still works after a PHP-only deploy because router.php
# treats that slug as the register form. /print-shops/register is two
# segments and needs this rewrite (or the 404.php recovery if
# error_page 404 /404.php is already set).

rewrite ^/print-shops/register/?$          /printshop/register.php last;
rewrite ^/ar/print-shops/register/?$       /printshop/register.php?lang=ar last;
rewrite ^/partners/?$                      /printshop/register.php last;
rewrite ^/ar/partners/?$                   /printshop/register.php?lang=ar last;
