<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Cardify loading">
  <defs>
    <linearGradient id="cardifyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="6"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#cardifyGradient)" stroke-width="6" stroke-linecap="round" stroke-dasharray="60 120">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#softShadow)">
    <rect x="26" y="36" width="68" height="44" rx="10" fill="url(#cardifyGradient)">
      <animateTransform attributeName="transform" type="rotate" values="-3 60 58; 3 60 58; -3 60 58" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="44" width="52" height="28" rx="6" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.9;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="50" width="10" height="10" rx="5" fill="#f59e0b"/>
    <rect x="54" y="50" width="24" height="4" rx="2" fill="#2563eb"/>
    <rect x="54" y="58" width="18" height="4" rx="2" fill="#93c5fd"/>
  </g>

  <circle cx="60" cy="12" r="3" fill="#f59e0b">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="60" r="3" fill="#2563eb">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="108" r="3" fill="#f59e0b">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="60" r="3" fill="#2563eb">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>
